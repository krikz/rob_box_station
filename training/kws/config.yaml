# Модель ключевых слов колонки (вейк + команды без облака). Переучить на другие слова: поправь `classes`
# (и при желании `negatives`), затем `./run.sh` на песочнице. Имя класса — то, что модель отдаёт хосту.
sample_rate: 16000
window_s: 1.0            # окно, которое видит модель: слово целиком должно влезать

classes:
  igorek:                # вейк колонки — Шифу 07.11: «игоряна побольше вариаций»
    - игорёк
    - игорёчек
    - игорёша
    - игорюша
    - игорёха
    - игорян
    - игорёк, привет
    - эй, игорёк
  stop:
    - стоп
    - хватит
    - замолчи
  louder:
    - громче
    - погромче
  quieter:
    - тише
    - потише

# Похожие на вейк и частые в мастерской слова — модель учится НЕ срабатывать на них (класс _unknown_).
# «Игорь» и «Егорка» — тоже сюда: обычные имена, на них колонка звать себя не должна.
negatives:
  - игорь
  - егор
  - егорка
  - огонёк
  - горе
  - город
  - игра
  - игрок
  - игрушка
  - горка
  - уголёк
  - пирожок
  - робот
  - роббокс
  - алиса
  - яндекс
  - старт
  - стол
  - стопка
  - ходить
  - громко
  - гром
  - тихо
  - тишина
  - привет
  - пока
  - да
  - нет
  - хорошо
  - сделай
  - включи свет
  - который час
  - расскажи анекдот
  - как дела
  - что ты умеешь
  - паяльник
  - отвёртка
  - давай чай попьём
  - где мой телефон
  - слушай сюда

synth:
  speakers: [aidar, baya, kseniya, xenia, eugene]   # голоса Silero v4_ru
  rates: [x-slow, slow, medium, fast]
  pitches: [x-low, low, medium, high, x-high]
  per_phrase: 60          # сколько озвучек на одну фразу класса (голос × скорость × высота — случайно)
  per_negative: 15

model:
  width: 32              # каналы DS-CNN: 32 — ~6 млн умножений на окно, по силам процессору колонки

train:
  val_speaker: eugene     # этот голос — только в проверке: модель не видела его при обучении
  real_repeat: 5          # живые записи колонки повторяются в пуле: без этого 30 клипов тонут в 4500 озвучках
  epochs: 40
  batch: 128
  lr: 0.002
  examples_per_epoch: 20000
  snr_db: [0, 25]         # шум мастерской подмешивается с таким отношением сигнал/шум
  silence_share: 0.10
  unknown_share: 0.35
